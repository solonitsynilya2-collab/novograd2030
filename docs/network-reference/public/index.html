<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новоград 2030 — сеть</title><style>
:root{--bg:#09101e;--p:#121c31;--p2:#17243e;--line:#2c3b5b;--txt:#eef4ff;--muted:#9eabc3;--a:#70a2ff;--good:#62d39a;--bad:#ff7788;--warn:#f4c95d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080d18,#101c32 55%,#0b1428);color:var(--txt);font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.card{background:rgba(18,28,49,.96);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 35px #0004}h1,h2,h3{margin-top:0}.muted{color:var(--muted)}button{border:1px solid var(--line);border-radius:10px;background:#1a2947;color:var(--txt);padding:10px 14px;cursor:pointer}button.primary{background:#3a6ed0;border-color:#6c9bf2}button.good{background:#17553d;border-color:#43a77b}input,textarea,select{width:100%;background:#0b1426;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px}.field{margin:10px 0}.field label{display:block;margin-bottom:5px}.big{font-size:42px;font-weight:900;letter-spacing:6px}.row{display:flex;gap:9px;flex-wrap:wrap}.choice{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0}.choice .r{display:flex;align-items:center;gap:10px}.choice input{width:auto}.choice input[type=range]{flex:1}.stat{font-size:28px;font-weight:800}.team{border:1px solid var(--line);padding:10px;border-radius:10px}.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.tag{font-size:12px;background:#203354;padding:3px 7px;border-radius:99px}.notice{border-left:4px solid var(--a);padding:12px;background:#111e35;border-radius:8px}.timer{font-size:56px;text-align:center;font-weight:900}.hidden{display:none}.ok{color:var(--good)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #293754;text-align:left}@media(max-width:850px){.c8,.c6,.c4{grid-column:span 12}.teams{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Новоград 2030 — Прорыв дамбы</h1><div class="muted">Сетевая версия: ведущий + телефоны участников + общий экран</div></div><div id="conn" class="tag">offline</div></div><div id="app"></div></div><script>
const moves=[
['День ЧС','Дамба дала трещину. Вода быстро прибывает. Ресурсов хватает только на одно действие.',['Эвакуировать низину','Укрепить дамбу','Открыть аварийный сброс','Ждать дополнительных данных']],
['+1 день','Город частично работает, но последствия первого решения уже проявились.',['Расширить эвакуацию','Закрыть повреждённый мост','Передать срочный контракт подрядчику','Сосредоточиться на возвращении бизнеса']],
['+3 дня','Внешние эксперты спорят о стратегии. Доверие жителей заметно меняется.',['Полностью остановить рискованные объекты','Запустить временную схему движения','Ускорить капитальный ремонт','Публично признать ошибки и раскрыть данные']]
];
let me=JSON.parse(sessionStorage.getItem('novome')||'null'), state=null, timer=null;
const $=x=>document.querySelector(x); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function post(url,data){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json())}
function connect(){if(!me)return; const es=new EventSource('/events?session='+me.session); es.onopen=()=>$('#conn').textContent='online';es.onerror=()=>$('#conn').textContent='reconnecting';es.onmessage=e=>{state=JSON.parse(e.data);render()}}
function login(){document.querySelector('#login').innerHTML='<div class="field"><label>Код сессии</label><input id="sid" maxlength="6" placeholder="например, A1B2C3"></div><div class="field"><label>Ваш код</label><input id="code" maxlength="8" placeholder="код участника или ведущего"></div><button class="primary" onclick="join()">Войти</button>'}
function home(){app.innerHTML='<div class="grid"><div class="card c6"><h2>Создать игру</h2><p class="muted">Ведущий получает код сессии и секретный ключ.</p><button class="primary" onclick="create()">Создать сессию</button></div><div class="card c6"><h2>Подключиться</h2><div id="login"></div></div><div class="card c12"><div class="notice"><b>Сетевая модель:</b> один браузер ведущего управляет ходами, каждый участник входит по личному коду. Общие результаты транслируются всем подключённым, фамилии нигде не выводятся.</div></div></div>';login()}
async function create(){let x=await post('/api/session',{});me={session:x.session,admin:x.admin,role:'admin'};sessionStorage.setItem('novome',JSON.stringify(me));connect();}
async function join(){let session=$('#sid').value.trim().toUpperCase(),code=$('#code').value.trim().toUpperCase();let x=await post('/api/join',{session,code});if(x.error)return alert(x.error);me={session,code,role:x.role,team:x.team,goal:x.goal};sessionStorage.setItem('novome',JSON.stringify(me));connect()}
function controls(){return `<div class="card c4"><h2>Пульт ведущего</h2><div class="row"><button class="primary" onclick="ctl('start')">Начать</button><button onclick="ctl('round2')">2-й раунд</button><button onclick="ctl('move')">Следующий день</button><button onclick="ctl('final')">Финал</button><button onclick="ctl('reset')">Сброс</button></div><p class="muted small">Сессия: <b>${me.session}</b><br>Ключ ведущего: <b>${me.admin}</b></p><div class="timer" id="tm">90</div><div class="row"><button onclick="startTimer(90)">90 сек</button><button onclick="startTimer(60)">60 сек</button><button onclick="startTimer(600)">10 мин</button></div></div>`}
function dashboard(){let s=state;return `<div class="grid">${controls()}<div class="card c8"><h2>Общий экран</h2><div class="notice"><b>${s.phase}</b> · ${s.move<3?moves[s.move][0]:'Финальное решение'}</div>${s.move<3?`<h3>${esc(moves[s.move][1])}</h3>${moves[s.move][2].map((x,i)=>`<div class="choice"><b>${i+1}. ${esc(x)}</b><div class="muted">Средняя оценка: ${s.summary?.[s.move]?.[i]?.avg==null?'—':s.summary[s.move][i].avg.toFixed(2)} · n=${s.summary?.[s.move]?.[i]?.count||0}</div></div>`).join('')}<div class="row"><button onclick="decide(0)">Принять 1</button><button onclick="decide(1)">Принять 2</button><button onclick="decide(2)">Принять 3</button><button onclick="decide(3)">Принять 4</button></div>`:finalBoard()}</div><div class="card c12"><h2>Команды онлайн</h2><div class="teams">${s.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><span class="tag">${s.participants[t.id]||0} ответов</span></div>`).join('')}</div></div></div>`}
function finalBoard(){return '<div class="notice">Финал: команды заполняют критерии и проекты со своих устройств. После отправки ведущий видит сводный рейтинг.</div>'+(state.final?'<pre>'+esc(JSON.stringify(state.final,null,2))+'</pre>':'')}
function participant(){let s=state;if(s.phase==='lobby')return `<div class="card"><h2>Ожидаем старта</h2><p>Команда: <b>${esc(me.team)}</b>. Не закрывайте страницу.</p><div class="timer">—</div></div>`;if(s.phase==='final'||s.phase==='results')return finalParticipant();if(s.phase==='decision')return `<div class="card"><h2>Решение принято</h2><p class="muted">Ведущий объявляет последствия. Ждите следующего хода.</p></div>`;return `<div class="grid"><div class="card c4"><h2>${esc(teamName(me.team))}</h2><div class="notice"><b>Тайная цель</b><br>${esc(me.goal)}</div></div><div class="card c8"><h2>${moves[s.move][0]}</h2><div class="notice">${esc(moves[s.move][1])}</div>${moves[s.move][2].map((x,i)=>`<div class="choice"><b>${i+1}. ${esc(x)}</b><div class="r"><input type="range" min="1" max="10" value="5" id="r${i}" oninput="this.nextElementSibling.textContent=this.value"><b>5</b></div></div>`).join('')}<div class="field"><label>Короткий аргумент</label><textarea id="arg" placeholder="Главный аргумент"></textarea></div><button class="primary" onclick="sendRating()">Отправить анонимно</button></div></div>`}
function finalParticipant(){return `<div class="grid"><div class="card c12"><h2>Финальное сравнение проектов</h2><p class="muted">Распределите 100 баллов между критериями. Затем оцените проекты по 1–5.</p><div class="field"><label>Вес безопасности</label><input id="w1" type="number" min="0" max="100" value="40"></div><div class="field"><label>Вес работы города</label><input id="w2" type="number" min="0" max="100" value="30"></div><div class="field"><label>Вес доверия жителей</label><input id="w3" type="number" min="0" max="100" value="30"></div><table><tr><th>Проект</th><th>Безопасность</th><th>Работа города</th><th>Доверие</th></tr>${['А — капитальный ремонт','Б — временная защита','В — новый комплексный проект'].map((x,i)=>`<tr><td>${x}</td><td><input id="a${i}1" type="number" min="1" max="5" value="3"></td><td><input id="a${i}2" type="number" min="1" max="5" value="3"></td><td><input id="a${i}3" type="number" min="1" max="5" value="3"></td></tr>`).join('')}</table><button class="primary" onclick="sendFinal()">Сохранить командное решение</button></div></div>`}
function teamName(id){return state?.teams.find(t=>t.id===id)?.name||id}
async function sendRating(){let scores=[0,1,2,3].map(i=>+$('#r'+i).value);await post('/api/rating',{session:me.session,code:me.code,move:state.move,round:state.round,scores,arg:$('#arg').value});alert('Ответ принят')}
async function sendFinal(){let weights=[+$('#w1').value,+$('#w2').value,+$('#w3').value], ratings=[0,1,2].map(i=>[+$('#a'+i+'1').value,+$('#a'+i+'2').value,+$('#a'+i+'3').value]);if(weights.reduce((a,b)=>a+b,0)!==100)return alert('Весы должны суммироваться ровно в 100');await post('/api/final',{session:me.session,code:me.code,weights,ratings});alert('Финальное решение сохранено')}
async function ctl(action){let consequences={security:Math.floor(Math.random()*5)+1,city:Math.floor(Math.random()*5)+1,trust:Math.floor(Math.random()*5)+1,text:'Ведущий фиксирует последствия выбранного варианта.'};if(action==='decide'){}let x=await post('/api/control',{session:me.session,admin:me.admin,action,consequences});if(x.error)alert(x.error)}
function decide(i){post('/api/control',{session:me.session,admin:me.admin,action:'decide',choice:i,consequences:{security:4-i,city:2+i,trust:3-i,text:'Последствия решения объявлены ведущим.'}})}
function startTimer(n){clearInterval(timer);let end=Date.now()+n*1000;timer=setInterval(()=>{let x=Math.max(0,Math.ceil((end-Date.now())/1000));$('#tm').textContent=x<60?'00:'+String(x).padStart(2,'0'):Math.floor(x/60)+':'+String(x%60).padStart(2,'0');if(x<=0)clearInterval(timer)},200)}
function render(){if(!state)return home();app.innerHTML=me.role==='admin'?dashboard():participant()}
if(me){connect()}else home();
</script></body></html>
