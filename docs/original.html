<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новоград 2030 — Прорыв дамбы</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#17223a;--line:#2b3957;--text:#eef3ff;--muted:#9eabc4;--accent:#73a7ff;--good:#68d391;--warn:#f6c85f;--bad:#ff7b8a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080d19,#101a31 55%,#0b1325);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#1a2743;color:var(--text)}button:hover{border-color:#5673a9}button.primary{background:#3869c7;border-color:#5b8ce8}button.danger{background:#48202a;border-color:#7e3443}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button.active{background:#315da9;border-color:#6e9cf1}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:rgba(18,26,45,.95);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 10px 30px #0003}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}.kpi{font-size:30px;font-weight:800}.timer{font-size:54px;font-weight:800;letter-spacing:1px;text-align:center;padding:8px}.timer.warn{color:var(--warn)}.timer.bad{color:var(--bad)}.bar{height:10px;background:#0a1020;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}.role{border:1px dashed #53658a;border-radius:12px;padding:12px;background:#101a2d}.role h3{margin:0 0 5px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#203052;color:#bcd2ff;font-size:12px;margin:2px}.status{padding:7px 10px;border-radius:9px;background:#111b2e}.ok{color:var(--good)}.warntext{color:var(--warn)}.badtext{color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #26334e;text-align:left;vertical-align:top}th{color:#b7c5df;font-weight:600}.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0}.choice input[type=range]{width:220px}.choice .num{width:32px;text-align:center;font-weight:800}.choice.selected{border-color:#5b8ce8;background:#162645}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field input,.field textarea,.field select{background:#0c1426;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}.field textarea{min-height:82px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px;border-left:4px solid var(--accent);background:#111d34;border-radius:8px}.dangerbox{border-left-color:var(--bad)}.successbox{border-left-color:var(--good)}.score{font-size:22px;font-weight:800}.pill{display:inline-flex;gap:5px;align-items:center}.teamgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.team{border:1px solid var(--line);border-radius:11px;padding:11px}.team b{display:block;margin-bottom:5px}.login{max-width:560px;margin:8vh auto}.bigcode{font-size:40px;letter-spacing:8px;font-weight:900}.footer{color:#7786a3;text-align:center;padding:30px}.print{background:white;color:black}@media(max-width:850px){.span8,.span6,.span4,.span3{grid-column:span 12}.teamgrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.choice{grid-template-columns:1fr}.choice input[type=range]{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='novograd2030_damba_v1';
const teams=[
 {id:'admin',name:'Администрация',goal:'Сохранить управляемость города и избежать личной ответственности.'},
 {id:'dam',name:'Руководство дамбы',goal:'Сохранить объект и избежать обвинений в халатности.'},
 {id:'contractor',name:'Подрядчик',goal:'Получить контракт на срочные работы и сохранить репутацию.'},
 {id:'rescue',name:'Спасатели',goal:'Минимизировать потери людей и получить ресурсы для реагирования.'},
 {id:'residents',name:'Жители',goal:'Защитить свой район, жильё и влияние на решение.'}
];
const moves=[
 {day:'День ЧС',intro:'После ливней уровень воды резко растёт. Датчики показывают критическую нагрузку на дамбу. Город ещё не затоплен, но времени мало.',choices:[
  ['A','Экстренно открыть часть водосброса','Снижает давление на дамбу, но создаёт локальное затопление.'],
  ['B','Эвакуировать уязвимые районы','Повышает безопасность людей, но требует транспорта и парализует часть города.'],
  ['C','Усилить дамбу силами подрядчика','Даёт шанс удержать воду, но занимает время и требует техники.'],
  ['D','Ничего не менять до новых данных','Сохраняет текущую работу города, но риск прорыва растёт.']]},
 {day:'+1 день',intro:'Прошла ночь. Последствия первого решения проявились. Прогноз уточнён: ещё один сильный импульс может привести к прорыву.',choices:[
  ['A','Полная контролируемая эвакуация','Максимально снижает риск для людей, но резко ухудшает работу города.'],
  ['B','Временное отключение инфраструктуры в зоне риска','Снижает ущерб при аварии, но вызывает перебои с водой и электричеством.'],
  ['C','Срочный ремонт уязвимого участка','Сохраняет функционирование города, но требует перераспределения ресурсов.'],
  ['D','Публично объявить, что угрозы нет','Успокаивает город сейчас, но при ухудшении ситуации резко падает доверие.']]},
 {day:'+3 дня',intro:'Вода отступает, но дамба повреждена. Бюджет ограничен. В городе спорят: тратить всё на безопасность сейчас или сохранить экономическую активность.',choices:[
  ['A','Закрыть опасный сектор до капитального ремонта','Высокая безопасность, сильный удар по бизнесу и занятости.'],
  ['B','Поставить временную защиту и открыть город','Быстро возвращает работу города, но оставляет остаточный риск.'],
  ['C','Передать ремонт подрядчику по срочному контракту','Быстро мобилизует ресурсы, но создаёт риск конфликта интересов.'],
  ['D','Распределить деньги между безопасностью и восстановлением','Компромиссный путь: ни один эффект не максимален.']]}
];
const projects=[
 ['P1','Капитальный ремонт дамбы','Безопасность 40 · Работа города 20 · Доверие 40'],
 ['P2','Новая система мониторинга и раннего предупреждения','Безопасность 30 · Работа города 35 · Доверие 35'],
 ['P3','Перенос части инфраструктуры из зоны риска','Безопасность 45 · Работа города 25 · Доверие 30'],
 ['P4','Программа восстановления районов и поддержки жителей','Безопасность 25 · Работа города 30 · Доверие 45']
];
function fresh(){return {mode:null,team:null,phase:'start',move:0,round:1,ratings:{},final:{},timer:{end:0,run:false},outcomes:[],messages:[],individual:{},session:'local',version:1}}
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function app(){document.getElementById('app').innerHTML=S.mode==='fac' ? facilitator() : S.mode==='part' ? participant() : landing()}
function landing(){return `<div class="wrap"><div class="login card"><div class="brand"><h1>🌊 Новоград 2030 — «Прорыв дамбы»</h1><p>Игровая практика: анонимный Delphi → решение → последствия → упрощённый AHP.</p></div><div class="notice">Пять команд. Три кризисных хода и финальное сравнение проектов восстановления. Участники отвечают под личными кодами; на общем экране — только агрегаты.</div><div class="actions"><button class="primary" onclick="setMode('fac')">Я ведущий</button><button onclick="setMode('part')">Я участник</button></div><p class="muted small">Данные этой версии сохраняются в браузере на устройстве. Для реального занятия можно открыть ведущий экран отдельно и раздать участникам ссылки/коды после адаптации под сервер.</p></div></div>`}
function nav(title){return `<div class="top"><div class="brand"><h1>${title}</h1><p>Прорыв дамбы · ${S.move<3?moves[S.move].day:'Финал восстановления'}</p></div><div class="tabs"><button onclick="setMode('fac')">Ведущий</button><button onclick="setMode('part')">Участник</button><button class="danger" onclick="resetAll()">Сброс</button></div></div>`}
function facilitator(){return `<div class="wrap">${nav('Пульт ведущего')}<div class="grid">
<div class="card span4"><div class="muted small">ФАЗА</div><div class="kpi">${phaseName()}</div><div class="timer" id="timer">${timerText()}</div><div class="bar"><i id="bar"></i></div><div class="actions"><button class="primary" onclick="startTimer()">▶ Старт</button><button onclick="pauseTimer()">Пауза</button><button onclick="setTimer(90)">90с</button><button onclick="setTimer(60)">60с</button><button onclick="setTimer(600)">10м</button></div></div>
<div class="card span8"><h2>Сценарий</h2><div class="notice">${S.move<3?esc(moves[S.move].intro):'Команды сравнивают проекты восстановления. Сначала распределяют 100 баллов важности критериев, затем оценивают проекты по шкале 1–5 и получают рейтинг.'}</div><div class="actions">${S.move<3?`<button class="primary" onclick="openMove()">Показать ход участникам</button><button onclick="nextMove()">Следующий ход →</button>`:`<button class="primary" onclick="openFinal()">Открыть финал</button><button onclick="revealGoals()">Раскрыть тайные цели</button>`}</div></div>
<div class="card span8"><h2>Сводка ответов</h2>${aggregateTable()}</div><div class="card span4"><h2>Контроль</h2><div class="status">Ход: <b>${S.move+1}/4</b></div><div class="status">Раунд Delphi: <b>${S.round}</b></div><div class="status">Команд: <b>5</b></div><div class="status">Ответов в ходу: <b>${countCurrent()}</b></div><div class="actions"><button onclick="advanceRound()">Переключить раунд</button><button onclick="showOutcomes()">Последствия</button></div></div>
<div class="card span12"><h2>Командные карточки</h2><div class="teamgrid">${teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><span class="tag">тайная цель</span><div class="small muted">${esc(t.goal)}</div></div>`).join('')}</div></div>
<div class="card span12"><h2>Аргументы без имён</h2>${anonArgs()}</div>
<div class="card span12"><h2>Последствия и состояние города</h2>${outcomeBoard()}</div>
</div></div>`}
function participant(){return `<div class="wrap">${nav('Кабинет участника')}<div class="grid">${!S.team?participantLogin():participantMain()}</div></div>`}
function participantLogin(){return `<div class="card span6"><h2>Личный код</h2><p class="muted">Введите код, выданный ведущим. Фамилия в игре не показывается на общем экране.</p><div class="field"><label>Код участника</label><input id="pc" placeholder="например, A7K2" maxlength="8"></div><div class="actions"><button class="primary" onclick="loginParticipant()">Войти</button></div></div><div class="card span6"><h2>Роли</h2>${teams.map(t=>`<div class="role"><b>${esc(t.name)}</b><span class="tag">секретная цель</span></div>`).join('')}</div>`}
function participantMain(){let t=teams.find(x=>x.id===S.team); if(S.move>=3)return finalParticipant(t); return `<div class="card span4"><div class="muted">Ваша команда</div><div class="kpi">${esc(t.name)}</div><div class="role"><b>Тайная цель</b><br>${esc(t.goal)}</div><p class="muted small">Не раскрывайте её другим командам.</p></div><div class="card span8"><h2>${moves[S.move].day}: оценка вариантов</h2><div class="notice">${esc(moves[S.move].intro)}</div><p>Раунд ${S.round}. Оцените каждый вариант от 1 до 10 и коротко объясните главный аргумент. Во время оценивания не советуемся.</p>${moves[S.move].choices.map(c=>ratingRow(c)).join('')}<div class="field"><label>Короткий аргумент</label><textarea id="arg" placeholder="Почему этот вариант для города сейчас лучше/хуже других?"></textarea></div><div class="actions"><button class="primary" onclick="submitRating()">Отправить анонимно</button></div></div>`}
function ratingRow(c){let val=(S.ratings[S.move]?.[S.round]?.[S.team]?.vals?.[c[0]])||5;return `<div class="choice" id="ch${c[0]}"><div><b>${c[0]}. ${esc(c[1])}</b><div class="small muted">${esc(c[2])}</div></div><div class="pill"><input aria-label="Оценка ${c[0]}" type="range" min="1" max="10" value="${val}" oninput="this.nextElementSibling.textContent=this.value"><span class="num">${val}</span></div></div>`}
function finalParticipant(t){let f=S.final[S.team]||{weights:{safety:34,work:33,trust:33},ratings:{}};return `<div class="card span12"><h2>Финал · проект восстановления</h2><div class="notice">Сначала задайте важность критериев: распределите ровно 100 баллов. Затем поставьте каждому проекту оценку 1–5. Формула: сумма (вес критерия × оценка проекта).</div><div class="grid"><div class="card span4"><h3>Важность критериев</h3>${['safety','work','trust'].map((k,i)=>`<div class="field"><label>${['Безопасность','Работа города','Доверие жителей'][i]}</label><input type="number" min="0" max="100" value="${f.weights[k]}" id="w_${k}"></div>`).join('')}<div>Итого: <b id="wtot">100</b></div></div><div class="card span8"><h3>Оценки проектов (1–5)</h3>${projects.map(p=>`<div class="choice"><div><b>${p[0]} · ${esc(p[1])}</b><div class="small muted">${p[2]}</div></div><div><label class="small">Безоп.</label><input id="${p[0]}_s" type="number" min="1" max="5" value="${f.ratings[p[0]]?.s||3}"><label class="small"> Работа</label><input id="${p[0]}_w" type="number" min="1" max="5" value="${f.ratings[p[0]]?.w||3}"><label class="small"> Доверие</label><input id="${p[0]}_t" type="number" min="1" max="5" value="${f.ratings[p[0]]?.t||3}"></div></div>`).join('')}<div class="actions"><button class="primary" onclick="submitFinal()">Сохранить командное решение</button></div></div></div></div>`}
function phaseName(){if(S.move<3)return S.round===1?'Delphi · раунд 1':'Delphi · раунд 2';return 'AHP · финал'}
function timerText(){if(!S.timer.run||!S.timer.end)return '00:00';let n=Math.max(0,Math.ceil((S.timer.end-Date.now())/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function tick(){if(S.timer.run&&Date.now()>=S.timer.end){S.timer.run=false;save()}let el=document.getElementById('timer');if(el){let t=timerText();el.textContent=t;el.className='timer '+(t<'00:31'?'bad':t<'01:01'?'warn':'');let n=S.timer.run?Math.max(0,(S.timer.end-Date.now())/1000):0;let max=S.timer.max||90;document.getElementById('bar').style.width=Math.min(100,Math.max(0,n/max*100))+'%'}setTimeout(tick,250)}
function setTimer(sec){S.timer={run:false,end:0,max:sec};save();app()}
function startTimer(){let sec=S.timer.max||90;S.timer={run:true,end:Date.now()+sec*1000,max:sec};save();tick()}
function pauseTimer(){let remain=Math.max(0,S.timer.end-Date.now());S.timer={run:false,end:0,max:Math.ceil(remain/1000)||90};save();app()}
function openMove(){S.phase='rating';save();app()}
function advanceRound(){S.round=S.round===1?2:1;save();app()}
function nextMove(){if(S.move<2){S.move++;S.round=1;S.phase='rating';S.outcomes.push(outcomeFor(S.move-1));save();app()}else{S.move=3;S.round=1;S.phase='final';S.outcomes.push(outcomeFor(2));save();app()}}
function openFinal(){S.move=3;S.phase='final';save();app()}
function outcomeFor(idx){let r=S.ratings[idx]?.[2]||S.ratings[idx]?.[1]||{};let vals=Object.values(r).flatMap(x=>Object.values(x.vals||{}));let avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:5;return {day:moves[idx].day,avg:+avg.toFixed(2),effect:avg>=7?'Решение с высокой поддержкой: безопасность растёт, но цена/ограничения зависят от выбранного варианта.':'Поддержка умеренная: сохраняются риски для безопасности, работы города или доверия.'}}
function aggregateTable(){if(S.move>=3)return ahpTable();let r=S.ratings[S.move]?.[S.round]||{};return `<table><thead><tr><th>Вариант</th><th>Среднее</th><th>Ответов</th><th>Разброс</th></tr></thead><tbody>${moves[S.move].choices.map(c=>{let a=Object.values(r).map(x=>x.vals?.[c[0]]).filter(Boolean);let avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;let sd=a.length?Math.sqrt(a.reduce((x,y)=>x+(y-avg)**2,0)/a.length):0;return `<tr><td><b>${c[0]}</b> ${esc(c[1])}</td><td>${avg?avg.toFixed(2):'—'}</td><td>${a.length}</td><td>${a.length?sd.toFixed(2):'—'}</td></tr>`}).join('')}</tbody></table>`}
function ahpTable(){let arr=teams.map(t=>({team:t.name,f:S.final[t.id]})).filter(x=>x.f);return `<table><thead><tr><th>Команда</th>${projects.map(p=>`<th>${p[0]}</th>`).join('')}</tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.team)}</td>${projects.map(p=>`<td>${calcProject(x.f,p[0]).toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function calcProject(f,id){let w=f.weights||{safety:34,work:33,trust:33},r=f.ratings?.[id]||{s:3,w:3,t:3};return (w.safety*r.s+w.work*r.w+w.trust*r.t)/100}
function anonArgs(){let r=S.ratings[S.move]?.[S.round]||{};let arr=Object.values(r).map(x=>x.arg).filter(Boolean);if(!arr.length)return '<p class="muted">Пока нет аргументов.</p>';return '<ul>'+arr.map(a=>`<li>${esc(a)}</li>`).join('')+'</ul>'}
function outcomeBoard(){return S.outcomes.length?S.outcomes.map(o=>`<div class="notice ${o.avg>=7?'successbox':''}"><b>${esc(o.day)}</b> · средняя поддержка ${o.avg}<br>${esc(o.effect)}</div>`).join(''):'<p class="muted">Последствия появятся после завершения хода.</p>'}
function loginParticipant(){let code=document.getElementById('pc').value.trim().toUpperCase();let map={A7K2:'admin',B4M8:'dam',C9Q1:'contractor',D3R6:'rescue',E5T9:'residents'};if(!map[code])return alert('Код не найден в демо. Используйте A7K2, B4M8, C9Q1, D3R6 или E5T9.');S.team=map[code];S.session=code;save();app()}
function submitRating(){let vals={};moves[S.move].choices.forEach(c=>vals[c[0]]=+document.querySelector(`#ch${c[0]} input`).value);let arg=document.getElementById('arg').value.trim();S.ratings[S.move]??={};S.ratings[S.move][S.round]??={};S.ratings[S.move][S.round][S.team]={vals,arg,at:new Date().toISOString()};save();alert('Ответ принят анонимно.');app()}
function submitFinal(){let get=k=>+document.getElementById('w_'+k).value;let total=get('safety')+get('work')+get('trust');if(total!==100)return alert('Распределите ровно 100 баллов между критериями.');let ratings={};projects.forEach(p=>ratings[p[0]]={s:+document.getElementById(p[0]+'_s').value,w:+document.getElementById(p[0]+'_w').value,t:+document.getElementById(p[0]+'_t').value});S.final[S.team]={weights:{safety:get('safety'),work:get('work'),trust:get('trust')},ratings};save();alert('Командное решение сохранено.');app()}
function revealGoals(){alert(teams.map(t=>t.name+' — '+t.goal).join('\n'))}
function showOutcomes(){alert(S.outcomes.map(o=>o.day+': '+o.effect).join('\n')||'Пока нет последствий.')}
function setMode(m){S.mode=m;save();app()}
function resetAll(){if(confirm('Сбросить всю игру на этом устройстве?')){S=fresh();save();app()}}
setInterval(()=>{if(S.mode==='fac')tick()},500);app();
</script>
</body>
</html>
